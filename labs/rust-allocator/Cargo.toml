[package]
name = "rust-allocator"
version = "0.1.0"
edition = "2021"
description = "forge lab 01 — build a free-list allocator (kernelspace)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

[features]
# Names the module `rust-allocator@reference`: the site shows its run and never credits it.
reference = []

[profile.release]
opt-level = 2
debug = false
