[package]
name = "bpe-tokenizer"
version = "0.1.0"
edition = "2021"
description = "forge lab 03 — byte-level BPE tokenizer (kernelspace)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

[features]
# Names the module `bpe-tokenizer@reference`: the site shows its run and never credits it.
reference = []

[profile.release]
opt-level = 2
debug = false
