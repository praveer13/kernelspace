[package]
name = "xgrammar-lite"
version = "0.1.0"
edition = "2021"
description = "forge lab 08 — JSON Schema pushdown matching and tokenizer-aware masks (kernelspace)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

[features]
# Names the module `xgrammar-lite@reference`: the site shows its run and never credits it.
reference = []

[profile.release]
opt-level = 2
debug = false
