[package]
name = "rust-zero-r1"
version = "0.1.0"
edition = "2021"
description = "Rust Zero R1 — bindings, types, and expressions"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-zero-harness = { path = "../harness" }

[features]
# Names the module `rust-zero-r1@reference`: the site shows its run and never credits it.
reference = []
