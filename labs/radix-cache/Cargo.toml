[package]
name = "radix-cache"
version = "0.1.0"
edition = "2021"
description = "forge lab 07 — automatic prefix caching with radix lookup and leaf LRU (kernelspace)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

[features]
# Names the module `radix-cache@reference`: the site shows its run and never credits it.
reference = []

[profile.release]
opt-level = 2
debug = false
