name: Publish static leaderboard

on:
  push:
    branches: [master]
    paths:
      - 'submissions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-leaderboard
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out merged master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Re-verify and build static artifact
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          timeout --signal=KILL 900s bun scripts/build-leaderboard.ts

      - name: Seal verified JSON as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-leaderboard
          path: public/leaderboard.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      # This privileged job never executes a candidate WASM or repository
      # build script. It only validates and commits the sealed JSON.
      - name: Check out merged master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Download verified JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-leaderboard
          path: .leaderboard-artifact

      - name: Validate sealed artifact shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          source = pathlib.Path(".leaderboard-artifact/leaderboard.json")
          if not source.is_file() or source.is_symlink() or source.stat().st_size > 2_000_000:
              raise SystemExit("verified leaderboard artifact is missing, linked, or oversized")
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("schemaVersion") != 1 or not isinstance(data.get("entries"), list):
              raise SystemExit("verified leaderboard artifact has the wrong schema")
          destination = pathlib.Path("public/leaderboard.json")
          shutil.copyfile(source, destination)
          PY

      - name: Commit changed leaderboard
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/leaderboard.json; then
            echo 'Leaderboard already current.'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'kernelspace-leaderboard[bot]'
          git config user.email 'kernelspace-leaderboard[bot]@users.noreply.github.com'
          git add -- public/leaderboard.json
          test "$(git diff --cached --name-only)" = 'public/leaderboard.json'
          git commit -m 'chore: publish leaderboard [skip ci]'
          git push origin HEAD:master
          echo 'published=true' >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not recursively trigger push
      # workflows, so explicitly dispatch the Pages build for the new commit.
      - name: Queue Pages deploy
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
