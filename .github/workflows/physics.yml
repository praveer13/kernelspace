name: Physics

# The Fleet physics v2 gate in full (docs/specs/s5.md §5.2, S5-D23): `verify:physics --full` replays every kept
# InferenceX point through EngineV2, fits each row on the fit subset, scores leave-one-out and held-out error, and
# regenerates src/lib/world/physics/table.ts and docs/physics/report.json in memory; it fails on a G1-G5 failure of a
# `calibrated` row and on any difference from the committed files. The fast mode (`verify:physics`, under 15 s) runs in
# ci.yml and deploy.yml on every run; this job is the slow half, so it runs only when a file it reads changes (GitHub
# filters `paths` per workflow, not per job) and, from S5-08, nightly.
#
# Budget: 120 s for the verify step (it is about 22 s on the dev host). If a runner exceeds it, the step times out and
# this job moves to nightly only, as verify:seeds did (S5-D23); fast mode still guards every PR through the input hash
# and the consistency check.
on:
  pull_request:
    paths:
      - 'src/lib/world/physics/**'
      - 'src/data/physics/**'
      - 'src/data/claims/lazy/physics.ts'
      - 'docs/physics/**'
      - 'scripts/*physics*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in ci.yml and deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci

      - name: verify:physics --full (120 s budget)
        timeout-minutes: 2
        run: bun run verify:physics --full
