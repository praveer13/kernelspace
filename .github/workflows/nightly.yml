name: Nightly

# Slow checks that would blow the 10-minute PR fast gate (PLAN-100X §7.4).
# verify:seeds scans 10,000 graded Fleet Week seeds for degenerate ones; it takes
# minutes, so it lives here instead of in ci.yml and deploy.yml.
# a11y (axe and the sideways-scroll check at 360, 320 and 1280 px over the routes in
# scripts/a11y.mjs) and e2e (the Playwright keyboard walks in e2e/) need a browser
# (docs/specs/wave-2.md §22.2).
# physics runs `verify:physics --full` (the Fleet physics v2 gate in full and the decision tables,
# docs/specs/s5.md §5.2, S5-D23) and fails as any nightly job does. physics-controls prints the
# NIM cross-harness panel, the MI325X/MI355X control and the frozen-form report on any newer
# snapshot (S5-08, S5-D65); it never fails and never files the nightly-failure issue: the script
# exits 0 whatever happens, the job continues on error, and the report job does not need it.
# Nothing here blocks anything: no other workflow needs these jobs, and when one fails the
# report job opens one issue (or comments on the open one) with a link to the run.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  verify-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in ci.yml and deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: bun run verify:seeds

  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: bun run verify:physics --full

  physics-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      # Prints the panels and whether the committed docs/physics/controls.json still holds; writes nothing.
      - run: bun scripts/physics-controls.ts --print

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # The Playwright version is pinned by package-lock.json; this fetches its matching Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  report:
    needs: [verify-seeds, physics, a11y, e2e]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEEDS: ${{ needs.verify-seeds.result }}
          PHYSICS: ${{ needs.physics.result }}
          A11Y: ${{ needs.a11y.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          gh label create nightly-failure --color B60205 --description 'A nightly check failed' 2>/dev/null || true
          body=$(printf 'Nightly run: %s\n\n- verify:seeds: %s\n- verify:physics --full: %s\n- npm run a11y: %s\n- npm run e2e: %s\n' "$RUN_URL" "$SEEDS" "$PHYSICS" "$A11Y" "$E2E")
          open=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label nightly-failure --title 'Nightly checks failed' --body "$body"
          fi
