name: Nightly

# Slow checks that would blow the 10-minute PR fast gate (PLAN-100X §7.4).
# verify:seeds scans 10,000 graded Fleet Week seeds for degenerate ones; it takes
# minutes, so it lives here instead of in ci.yml and deploy.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  verify-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in ci.yml and deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: bun run verify:seeds
