name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Custom domain (kernelspace.naigap.com) is served from / — see public/CNAME
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Known BrowserRouter URLs receive real index documents (HTTP 200 after
      # Pages' canonical trailing-slash redirect). Unknown URLs retain the SPA
      # fallback so React Router can render its own not-found experience.
      - run: node scripts/prepare-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
