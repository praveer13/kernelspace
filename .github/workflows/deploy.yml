name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in
      # validate-leaderboard-submission.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Custom domain (kernelspace.naigap.com) is served from / — see public/CNAME
      - run: npm ci
      - run: npm run lint

      # Fast gate (PLAN-100X §7.4): blocking content and contract checks.
      - run: bun run verify:items
      - run: bun run verify:capstone
      - run: bun run verify:traces
      - run: bun run verify:leaderboard
      - run: bun run verify:field-notes

      - name: Export freshness (if this fails the committed export is stale; run bun scripts/export-lessons-md.ts and commit)
        run: bun scripts/export-lessons-md.ts && git diff --exit-code -- public/lessons-md public/llms.txt

      - run: npm run build

      # Bundle budget (PLAN-100X §7.3): the entry chunk must stay <= 250 KB gzip.
      - run: bun run verify:bundle

      # Known BrowserRouter URLs receive real index documents (HTTP 200 after
      # Pages' canonical trailing-slash redirect). Unknown URLs retain the SPA
      # fallback so React Router can render its own not-found experience.
      - run: node scripts/prepare-pages.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
