name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: npm run lint

      # Fast gate (PLAN-100X §7.4): blocking content and contract checks.
      - run: bun run verify:items
      - run: bun run verify:capstone
      - run: bun run verify:traces
      - run: bun run verify:leaderboard
      - run: bun run verify:field-notes

      - run: npm run build

      - name: Export freshness (if this fails the committed export is stale; run bun scripts/export-lessons-md.ts and commit)
        run: bun scripts/export-lessons-md.ts && git diff --exit-code -- public/lessons-md public/llms.txt
