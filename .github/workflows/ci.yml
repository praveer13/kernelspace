name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit suite runs in its own job, beside the gates below, so the two finish in about half the time.
  # On a GitHub runner the suite takes about 6 minutes (twice this repo's dev host) and the gates about 4.
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The verify:* scripts run under Bun, pinned as in deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: npm run lint

      # Fast gate (PLAN-100X §7.4): blocking content and contract checks.
      - run: bun run verify:items
      - run: bun run verify:capstone
      - run: bun run verify:traces
      - run: bun run verify:leaderboard
      - run: bun run verify:field-notes
      - run: bun run verify:errata
      - run: bun run verify:claims

      # Fleet physics v2 (docs/specs/s5.md §5.2): the protocol's and the snapshot's shas, the table's input hash, the
      # consistency check and the eligibility of every consumer; under 15 s. The replays and the fit are `--full`,
      # which has its own workflow (physics.yml).
      - run: bun run verify:physics

      # Wave 1 gates (docs/specs/wave-1.md §16.4). Reserved by the scaffold; each exits 0 with
      # "pending: <task>" until its owner lands it, and then blocks like the rest.
      - run: bun run verify:kc
      - run: bun run verify:generators
      - run: bun run verify:determinism
      - run: bun run verify:plays
      - run: bun run verify:guardrails
      - run: bun run verify:mentor
      - run: bun run verify:search-index

      # Wave 2 (docs/specs/wave-2.md §15.2): a stub that prints "pending: 2c-04" until the compile bank lands.
      - run: bun run verify:rust-items

      - run: npm run build

      # Bundle budget (PLAN-100X §7.3): the entry chunk must stay <= 250 KB gzip.
      - run: bun run verify:bundle

      - name: Export freshness (if this fails the committed export is stale; run bun scripts/export-lessons-md.ts and commit)
        run: bun scripts/export-lessons-md.ts && git diff --exit-code -- public/lessons-md public/llms.txt

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The suite runs under Bun, pinned as in deploy.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci

      # Unit and property suites (ledger core: spec docs/specs/ledger-v3.md §13): pure, no browser needed.
      # package.json gives every test a 20 s default limit; a GitHub runner is about twice as slow as the dev host.
      - run: bun run test
